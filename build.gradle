plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.wifimanager.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wifimanager.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
